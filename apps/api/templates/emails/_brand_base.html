<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}UnionclinTask{% endblock %}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f5f7;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #3f3f46;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: none;
    "
  >
    {% block preheader %}{% endblock %}
    <center style="width: 100%; background-color: #f4f5f7; padding: 32px 0;">
      <table role="presentation" width="100%">
        <tr>
          <td></td>
          <td class="email-container" width="600" style="width: 600px; max-width: 600px; margin: 0 auto;">
            <!-- Header -->
            <table role="presentation" width="100%" style="background-color: #ffffff; border-radius: 10px 10px 0 0;">
              <tr>
                <td style="padding: 22px 32px; text-align: left; border-bottom: 1px solid #ececf1;">
                  <img
                    src="cid:unionclintask-logo"
                    width="40"
                    height="40"
                    alt="UnionclinTask"
                    style="display: inline-block; border: 0; height: auto; vertical-align: middle;"
                  />
                  <span
                    style="
                      display: inline-block;
                      margin-left: 12px;
                      font-size: 18px;
                      font-weight: 600;
                      color: #111827;
                      vertical-align: middle;
                    "
                  >
                    UnionclinTask
                  </span>
                </td>
              </tr>
            </table>
            <!-- Body -->
            <table role="presentation" width="100%" style="background-color: #ffffff;">
              <tr>
                <td
                  class="email-content"
                  style="padding: 32px; font-size: 15px; line-height: 1.6; color: #3f3f46;"
                >
                  {% block content %}{% endblock %}
                </td>
              </tr>
            </table>
            <!-- Footer -->
            <table role="presentation" width="100%" style="background-color: #ffffff; border-radius: 0 0 10px 10px;">
              <tr>
                <td
                  style="
                    padding: 20px 32px;
                    border-top: 1px solid #ececf1;
                    font-size: 12px;
                    line-height: 1.6;
                    color: #9ca3af;
                    text-align: center;
                  "
                >
                  {% block footer %}&copy; UnionclinTask{% endblock %}
                </td>
              </tr>
            </table>
          </td>
          <td></td>
        </tr>
      </table>
    </center>
  </body>
</html>
