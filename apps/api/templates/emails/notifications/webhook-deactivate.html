{% extends "emails/_brand_base.html" %}
{% block title %}Webhook deactivated{% endblock %}
{% block content %}
<h1 style="margin: 0 0 12px; font-size: 20px; line-height: 1.35; font-weight: 600; color: #111827;">
  Webhook deactivated
</h1>
<p style="margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #4b5563;">{{ message }}</p>
<p style="margin: 24px 0;">
  <a
    href="{{ webhook_url }}"
    target="_blank"
    style="
      display: inline-block;
      padding: 12px 22px;
      background-color: #3e63dd;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
    "
  >
    Review webhook
  </a>
</p>
<p style="margin: 16px 0 0; font-size: 13px; line-height: 1.6; color: #6b7280;">
  This message was sent to {{ email }}.
</p>
{% endblock %}
